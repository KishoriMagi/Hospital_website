<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1740" width="750" height="1740" style="background:#F6F8FA;">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .terminal-box { fill: #1E3A2F; rx: 20; ry: 20; }
  .terminal-text { fill: #FFFFFF; font-size: 13px; font-weight: 600; text-anchor: middle; }
  
  .process-box { fill: #E8F8F5; stroke: #107C41; stroke-width: 1.8; rx: 5; ry: 5; }
  .process-header { fill: #0E6251; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .process-sub { fill: #145A32; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
  
  .decision-diamond { fill: #FFF9E6; stroke: #E67E22; stroke-width: 2; }
  .decision-text { fill: #A04000; font-size: 12px; font-weight: 600; text-anchor: middle; }
  
  .error-box { fill: #FDEDEC; stroke: #E74C3C; stroke-width: 1.8; rx: 5; ry: 5; }
  .error-header { fill: #922B21; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .error-sub { fill: #78281F; font-size: 11px; font-weight: 500; text-anchor: middle; }
  
  .success-box { fill: #EAFAF1; stroke: #27AE60; stroke-width: 1.8; rx: 5; ry: 5; }
  .success-header { fill: #196F3D; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .success-sub { fill: #145A32; font-size: 11px; font-weight: 500; text-anchor: middle; }
  
  .arrow-line { stroke: #4A5568; stroke-width: 1.8; fill: none; }
  .status-badge { font-size: 11.5px; font-weight: 700; }
  .tag-black { fill: #2D3748; rx: 3; ry: 3; }
  .tag-text { fill: #FFFFFF; font-size: 10px; font-weight: 700; text-anchor: middle; }
</style>

<defs>
  <marker id="arr-lab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4A5568" />
  </marker>
</defs>

<!-- TITLE HEADER -->
<text x="375" y="32" font-size="17" font-weight="700" fill="#107C41" text-anchor="middle">DIAGNOSTIC LABORATORY PROCESSING PORTAL — FLOWCHART</text>
<text x="375" y="50" font-size="11.5" font-weight="500" fill="#4A5568" text-anchor="middle">Port 5000 • Ingestion REST API, Analyzer Entry, Reference Bounds Evaluation</text>

<!-- 1. START TERMINAL -->
<rect class="terminal-box" x="200" y="70" width="350" height="42" />
<text class="terminal-text" x="375" y="92" dy="4">Start: Inbound HTTP POST /api/requests</text>

<!-- Line 1 -> 2 -->
<line class="arrow-line" x1="375" y1="112" x2="375" y2="145" marker-end="url(#arr-lab)" />

<!-- 2. AUTHENTICATION &amp; HEADER CHECK -->
<rect class="process-box" x="165" y="145" width="420" height="52" />
<text class="process-header" x="375" y="165">routes/requests.py (@require_api_key)</text>
<text class="process-sub" x="375" y="183">Verifies X-API-Key token against Config.LAB_API_KEY</text>

<!-- Line 2 -> Decision 1 -->
<line class="arrow-line" x1="375" y1="197" x2="375" y2="240" marker-end="url(#arr-lab)" />

<!-- 3. DECISION 1: API Key Valid? -->
<polygon class="decision-diamond" points="375,240 495,310 375,380 255,310" />
<text class="decision-text" x="375" y="300">Is API Key authentic</text>
<text class="decision-text" x="375" y="318">&amp; verified?</text>

<!-- Decision 1 - NO (Left) -->
<line class="arrow-line" x1="255" y1="310" x2="160" y2="310" />
<line class="arrow-line" x1="160" y1="310" x2="160" y2="405" marker-end="url(#arr-lab)" />
<rect class="tag-black" x="145" y="335" width="30" height="18" />
<text class="tag-text" x="160" y="348">No</text>

<rect class="error-box" x="50" y="405" width="220" height="52" />
<text class="error-header" x="160" y="425">HTTP 401 Unauthorized</text>
<text class="error-sub" x="160" y="443">Reject call; invalid API credential</text>
<line class="arrow-line" x1="160" y1="457" x2="160" y2="490" marker-end="url(#arr-lab)" />
<rect class="terminal-box" x="60" y="490" width="200" height="38" />
<text class="terminal-text" x="160" y="510" dy="3.5">Stop: Access Denied</text>

<!-- Decision 1 - YES (Right) -->
<line class="arrow-line" x1="495" y1="310" x2="570" y2="310" />
<line class="arrow-line" x1="570" y1="310" x2="570" y2="405" marker-end="url(#arr-lab)" />
<rect class="tag-black" x="555" y="335" width="30" height="18" />
<text class="tag-text" x="570" y="348">Yes</text>

<!-- 4. VALIDATION SERVICE (SCHEMA &amp; TYPES) -->
<rect class="process-box" x="420" y="405" width="300" height="52" />
<text class="process-header" x="570" y="425">services/validation_service.py</text>
<text class="process-sub" x="570" y="443">Checks 10 required columns &amp; duplicate test_id</text>

<!-- Merge to Decision 2 -->
<line class="arrow-line" x1="570" y1="457" x2="570" y2="530" />
<line class="arrow-line" x1="570" y1="530" x2="375" y2="530" />
<line class="arrow-line" x1="375" y1="530" x2="375" y2="560" marker-end="url(#arr-lab)" />

<!-- 5. DECISION 2: Is Request Schema Valid? -->
<polygon class="decision-diamond" points="375,560 495,630 375,700 255,630" />
<text class="decision-text" x="375" y="620">Is payload valid &amp;</text>
<text class="decision-text" x="375" y="638">Test Type supported?</text>

<!-- Decision 2 - NO / 400 or 409 (Left) -->
<line class="arrow-line" x1="255" y1="630" x2="160" y2="630" />
<line class="arrow-line" x1="160" y1="630" x2="160" y2="725" marker-end="url(#arr-lab)" />
<rect class="tag-black" x="145" y="655" width="30" height="18" />
<text class="tag-text" x="160" y="668">No</text>

<rect class="error-box" x="40" y="725" width="240" height="52" />
<text class="error-header" x="160" y="745">HTTP 400 Bad Request / 409 Conflict</text>
<text class="error-sub" x="160" y="763">Duplicate ID or unsupported test type</text>
<line class="arrow-line" x1="160" y1="777" x2="160" y2="810" marker-end="url(#arr-lab)" />
<rect class="terminal-box" x="60" y="810" width="200" height="38" />
<text class="terminal-text" x="160" y="830" dy="3.5">Stop: Return JSON Error</text>

<!-- Decision 2 - YES / 201 (Right) -->
<line class="arrow-line" x1="495" y1="630" x2="570" y2="630" />
<line class="arrow-line" x1="570" y1="630" x2="570" y2="725" marker-end="url(#arr-lab)" />
<rect class="tag-black" x="555" y="655" width="30" height="18" />
<text class="tag-text" x="570" y="668">Yes</text>

<!-- 6. SAVE TO LAB DATABASE &amp; RETURN 201 -->
<rect class="process-box" x="420" y="725" width="300" height="52" />
<text class="process-header" x="570" y="745">database/models.py (RequestModel)</text>
<text class="process-sub" x="570" y="763">INSERT into laboratory.db; return HTTP 201</text>
<text class="status-badge" x="635" y="800" fill="#107C41">Status: Pending</text>

<!-- Merge to Lab UI Workflow -->
<line class="arrow-line" x1="570" y1="777" x2="570" y2="850" />
<line class="arrow-line" x1="570" y1="850" x2="375" y2="850" />
<line class="arrow-line" x1="375" y1="850" x2="375" y2="880" marker-end="url(#arr-lab)" />

<!-- 7. LAB TECHNICIAN LIFECYCLE MANAGEMENT -->
<rect class="process-box" x="165" y="880" width="420" height="52" />
<text class="process-header" x="375" y="900">routes/requests.py</text>
<text class="process-sub" x="375" y="918">Staff reviews specimen queue &amp; updates: Pending -&gt; Validated -&gt; Processing</text>

<!-- Line 7 -> 8 -->
<line class="arrow-line" x1="375" y1="932" x2="375" y2="965" marker-end="url(#arr-lab)" />

<!-- 8. MEASUREMENT ANALYZER ENTRY -->
<rect class="process-box" x="165" y="965" width="420" height="52" />
<text class="process-header" x="375" y="985">routes/results.py (process_test.html)</text>
<text class="process-sub" x="375" y="1003">Technician submits quantitative clinical measurements into web form</text>

<!-- Line 8 -> 9 -->
<line class="arrow-line" x1="375" y1="1017" x2="375" y2="1050" marker-end="url(#arr-lab)" />

<!-- 9. REFERENCE INTERVAL EVALUATION ENGINE -->
<rect class="process-box" x="165" y="1050" width="420" height="52" />
<text class="process-header" x="375" y="1070">services/processing_service.py</text>
<text class="process-sub" x="375" y="1088">Compares physiological values to REFERENCE_RANGES (CBC, Sugar, Lipid)</text>

<!-- Line 9 -> Decision 3 -->
<line class="arrow-line" x1="375" y1="1102" x2="375" y2="1145" marker-end="url(#arr-lab)" />

<!-- 10. DECISION 3: Within Clinical Bounds? -->
<polygon class="decision-diamond" points="375,1145 495,1215 375,1285 255,1215" />
<text class="decision-text" x="375" y="1205">Are all measurements within</text>
<text class="decision-text" x="375" y="1223">standard reference bounds?</text>

<!-- Decision 3 - ABNORMAL (Right) -->
<line class="arrow-line" x1="495" y1="1215" x2="570" y2="1215" />
<line class="arrow-line" x1="570" y1="1215" x2="570" y2="1310" marker-end="url(#arr-lab)" />
<rect class="tag-black" x="550" y="1245" width="40" height="18" />
<text class="tag-text" x="570" y="1258">No</text>

<rect class="error-box" x="460" y="1310" width="220" height="52" />
<text class="error-header" x="570" y="1330">Flag Result as: Abnormal</text>
<text class="error-sub" x="570" y="1348">Highlight out-of-range clinical flags</text>
<text class="status-badge" x="600" y="1385" fill="#C0392B">Result: Abnormal</text>

<!-- Decision 3 - NORMAL (Left) -->
<line class="arrow-line" x1="255" y1="1215" x2="180" y2="1215" />
<line class="arrow-line" x1="180" y1="1215" x2="180" y2="1310" marker-end="url(#arr-lab)" />
<rect class="tag-black" x="160" y="1245" width="40" height="18" />
<text class="tag-text" x="180" y="1258">Yes</text>

<rect class="success-box" x="70" y="1310" width="220" height="52" />
<text class="success-header" x="180" y="1330">Flag Result as: Normal</text>
<text class="success-sub" x="180" y="1348">Generate standard benign remarks</text>
<text class="status-badge" x="200" y="1385" fill="#27AE60">Result: Normal</text>

<!-- Merge Branches to 11 -->
<line class="arrow-line" x1="180" y1="1362" x2="180" y2="1425" />
<line class="arrow-line" x1="180" y1="1425" x2="375" y2="1425" />

<line class="arrow-line" x1="570" y1="1362" x2="570" y2="1425" />
<line class="arrow-line" x1="570" y1="1425" x2="375" y2="1425" />

<line class="arrow-line" x1="375" y1="1425" x2="375" y2="1455" marker-end="url(#arr-lab)" />

<!-- 11. PERSIST COMPLETED RESULT -->
<rect class="process-box" x="165" y="1455" width="420" height="52" />
<text class="process-header" x="375" y="1475">database/models.py (ResultModel)</text>
<text class="process-sub" x="375" y="1493">Save result record in laboratory.db &amp; update request status to Completed</text>
<text class="status-badge" x="605" y="1485" fill="#107C41">Status: Completed</text>

<!-- Line 11 -> 12 -->
<line class="arrow-line" x1="375" y1="1507" x2="375" y2="1540" marker-end="url(#arr-lab)" />

<!-- 12. EXPOSE OVER REST API -->
<rect class="process-box" x="165" y="1540" width="420" height="52" />
<text class="process-header" x="375" y="1560">routes/results.py (GET /api/results/&lt;test_id&gt;)</text>
<text class="process-sub" x="375" y="1578">Serializes result data, parameters, status &amp; remarks into JSON for Hospital client</text>

<!-- Line 12 -> Finish -->
<line class="arrow-line" x1="375" y1="1592" x2="375" y2="1630" marker-end="url(#arr-lab)" />

<!-- 13. FINISH TERMINAL -->
<rect class="terminal-box" x="200" y="1630" width="350" height="38" />
<text class="terminal-text" x="375" y="1650" dy="3.5">Finish: Diagnostic laboratory cycle complete</text>

</svg>