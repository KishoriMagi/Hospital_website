<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1740" width="750" height="1740" style="background:#F6F8FA;">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .terminal-box { fill: #1B365D; rx: 20; ry: 20; }
  .terminal-text { fill: #FFFFFF; font-size: 13px; font-weight: 600; text-anchor: middle; }
  
  .process-box { fill: #EBF3FB; stroke: #1B6EC2; stroke-width: 1.8; rx: 5; ry: 5; }
  .process-header { fill: #0B4F8A; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .process-sub { fill: #1E3A5F; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
  
  .decision-diamond { fill: #FFF9E6; stroke: #E67E22; stroke-width: 2; }
  .decision-text { fill: #A04000; font-size: 12px; font-weight: 600; text-anchor: middle; }
  
  .error-box { fill: #FDEDEC; stroke: #E74C3C; stroke-width: 1.8; rx: 5; ry: 5; }
  .error-header { fill: #922B21; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .error-sub { fill: #78281F; font-size: 11px; font-weight: 500; text-anchor: middle; }
  
  .success-box { fill: #EAFAF1; stroke: #27AE60; stroke-width: 1.8; rx: 5; ry: 5; }
  .success-header { fill: #196F3D; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .success-sub { fill: #145A32; font-size: 11px; font-weight: 500; text-anchor: middle; }
  
  .arrow-line { stroke: #4A5568; stroke-width: 1.8; fill: none; }
  .status-badge { font-size: 11.5px; font-weight: 700; }
  .tag-black { fill: #2D3748; rx: 3; ry: 3; }
  .tag-text { fill: #FFFFFF; font-size: 10px; font-weight: 700; text-anchor: middle; }
</style>

<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4A5568" />
  </marker>
</defs>

<!-- TITLE HEADER -->
<text x="375" y="32" font-size="17" font-weight="700" fill="#1B365D" text-anchor="middle">HOSPITAL PATIENT &amp; TEST PORTAL — FLOWCHART</text>
<text x="375" y="50" font-size="11.5" font-weight="500" fill="#4A5568" text-anchor="middle">Port 5001 • Direct REST API Architecture with Secure X-API-Key</text>

<!-- 1. START TERMINAL -->
<rect class="terminal-box" x="225" y="70" width="300" height="42" />
<text class="terminal-text" x="375" y="92" dy="4">Start: Clinician / Staff initiates test order</text>

<!-- Line 1 -> 2 -->
<line class="arrow-line" x1="375" y1="112" x2="375" y2="145" marker-end="url(#arr)" />

<!-- 2. PATIENT ONBOARDING -->
<rect class="process-box" x="165" y="145" width="420" height="52" />
<text class="process-header" x="375" y="165">routes/patients.py</text>
<text class="process-sub" x="375" y="183">Register new patient profile or select existing Patient_ID</text>

<!-- Line 2 -> 3 -->
<line class="arrow-line" x1="375" y1="197" x2="375" y2="230" marker-end="url(#arr)" />

<!-- 3. ORDER FORM -->
<rect class="process-box" x="165" y="230" width="420" height="52" />
<text class="process-header" x="375" y="250">routes/test_requests.py</text>
<text class="process-sub" x="375" y="268">Staff submits order (Test_ID, Test_Type, Priority, Sample, Instructions)</text>

<!-- Line 3 -> Decision 1 -->
<line class="arrow-line" x1="375" y1="282" x2="375" y2="325" marker-end="url(#arr)" />

<!-- 4. DECISION 1: Local Validation -->
<polygon class="decision-diamond" points="375,325 495,395 375,465 255,395" />
<text class="decision-text" x="375" y="385">Is Patient valid &amp;</text>
<text class="decision-text" x="375" y="403">Test_ID unique locally?</text>

<!-- Decision 1 - NO (Left) -->
<line class="arrow-line" x1="255" y1="395" x2="160" y2="395" />
<line class="arrow-line" x1="160" y1="395" x2="160" y2="490" marker-end="url(#arr)" />
<rect class="tag-black" x="145" y="420" width="30" height="18" />
<text class="tag-text" x="160" y="433">No</text>

<rect class="error-box" x="50" y="490" width="220" height="52" />
<text class="error-header" x="160" y="510">routes/test_requests.py</text>
<text class="error-sub" x="160" y="528">Flash error (Duplicate ID / Missing)</text>
<line class="arrow-line" x1="160" y1="542" x2="160" y2="575" marker-end="url(#arr)" />
<rect class="terminal-box" x="60" y="575" width="200" height="38" />
<text class="terminal-text" x="160" y="595" dy="3.5">Stop: Re-enter valid details</text>

<!-- Decision 1 - YES (Right) -->
<line class="arrow-line" x1="495" y1="395" x2="570" y2="395" />
<line class="arrow-line" x1="570" y1="395" x2="570" y2="490" marker-end="url(#arr)" />
<rect class="tag-black" x="555" y="420" width="30" height="18" />
<text class="tag-text" x="570" y="433">Yes</text>

<!-- 5. REST CLIENT SUBMISSION -->
<rect class="process-box" x="420" y="490" width="300" height="52" />
<text class="process-header" x="570" y="510">services/lab_api_service.py</text>
<text class="process-sub" x="570" y="528">POST /api/requests (JSON + X-API-Key)</text>

<!-- Merge to Decision 2 -->
<line class="arrow-line" x1="570" y1="542" x2="570" y2="615" />
<line class="arrow-line" x1="570" y1="615" x2="375" y2="615" />
<line class="arrow-line" x1="375" y1="615" x2="375" y2="645" marker-end="url(#arr)" />

<!-- 6. DECISION 2: Lab API Response -->
<polygon class="decision-diamond" points="375,645 495,715 375,785 255,715" />
<text class="decision-text" x="375" y="705">Laboratory API response</text>
<text class="decision-text" x="375" y="723">HTTP 201 Created?</text>

<!-- Decision 2 - NO / 400/409/500 (Left) -->
<line class="arrow-line" x1="255" y1="715" x2="160" y2="715" />
<line class="arrow-line" x1="160" y1="715" x2="160" y2="810" marker-end="url(#arr)" />
<rect class="tag-black" x="145" y="740" width="30" height="18" />
<text class="tag-text" x="160" y="753">No</text>

<rect class="error-box" x="40" y="810" width="240" height="52" />
<text class="error-header" x="160" y="830">HTTP Error (400/409/500)</text>
<text class="error-sub" x="160" y="848">Lab rejected request; DO NOT insert</text>
<line class="arrow-line" x1="160" y1="862" x2="160" y2="895" marker-end="url(#arr)" />
<rect class="terminal-box" x="60" y="895" width="200" height="38" />
<text class="terminal-text" x="160" y="915" dy="3.5">Stop: Alert Clinician in UI</text>

<!-- Decision 2 - YES / 201 (Right) -->
<line class="arrow-line" x1="495" y1="715" x2="570" y2="715" />
<line class="arrow-line" x1="570" y1="715" x2="570" y2="810" marker-end="url(#arr)" />
<rect class="tag-black" x="555" y="740" width="30" height="18" />
<text class="tag-text" x="570" y="753">Yes</text>

<!-- 7. COMMIT TO HOSPITAL SQLITE -->
<rect class="process-box" x="420" y="810" width="300" height="52" />
<text class="process-header" x="570" y="830">database/database.py</text>
<text class="process-sub" x="570" y="848">INSERT test_requests</text>
<text class="status-badge" x="625" y="885" fill="#1B6EC2">Status: Sent to Laboratory</text>

<!-- Merge to External Step -->
<line class="arrow-line" x1="570" y1="862" x2="570" y2="935" />
<line class="arrow-line" x1="570" y1="935" x2="375" y2="935" />
<line class="arrow-line" x1="375" y1="935" x2="375" y2="965" marker-end="url(#arr)" />

<!-- 8. EXTERNAL LAB PROCESSING (REST API) -->
<rect x="140" y="965" width="470" height="65" rx="8" ry="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="2" stroke-dasharray="6 4" />
<text x="375" y="990" font-size="13" font-weight="700" fill="#A04000" text-anchor="middle">[EXTERNAL: Diagnostic Laboratory Portal — Port 5000]</text>
<text x="375" y="1008" font-size="11.5" font-weight="500" fill="#7E5109" text-anchor="middle">Technicians analyze specimen, evaluate bounds, and save Completed result</text>

<!-- Line 8 -> 9 -->
<line class="arrow-line" x1="375" y1="1030" x2="375" y2="1070" marker-end="url(#arr)" />

<!-- 9. SYNC INITIATION -->
<rect class="process-box" x="165" y="1070" width="420" height="52" />
<text class="process-header" x="375" y="1090">routes/results.py</text>
<text class="process-sub" x="375" y="1108">Doctor clicks "Check Laboratory Result" or "Sync Results"</text>

<!-- Line 9 -> 10 -->
<line class="arrow-line" x1="375" y1="1122" x2="375" y2="1155" marker-end="url(#arr)" />

<!-- 10. FETCH RESULT OVER REST API -->
<rect class="process-box" x="165" y="1155" width="420" height="52" />
<text class="process-header" x="375" y="1175">services/lab_api_service.py</text>
<text class="process-sub" x="375" y="1193">GET /api/results/&lt;test_id&gt; (Header: X-API-Key)</text>

<!-- Line 10 -> Decision 3 -->
<line class="arrow-line" x1="375" y1="1207" x2="375" y2="1250" marker-end="url(#arr)" />

<!-- 11. DECISION 3: Is Result Completed? -->
<polygon class="decision-diamond" points="375,1250 495,1320 375,1390 255,1320" />
<text class="decision-text" x="375" y="1310">Is Result Ready &amp;</text>
<text class="decision-text" x="375" y="1328">HTTP 200 returned?</text>

<!-- Decision 3 - NO / HTTP 404 Still Processing (Left) -->
<line class="arrow-line" x1="255" y1="1320" x2="160" y2="1320" />
<line class="arrow-line" x1="160" y1="1320" x2="160" y2="1415" marker-end="url(#arr)" />
<rect class="tag-black" x="145" y="1345" width="30" height="18" />
<text class="tag-text" x="160" y="1358">No</text>

<rect class="process-box" x="50" y="1415" width="220" height="52" />
<text class="process-header" x="160" y="1435">HTTP 404 (Processing)</text>
<text class="process-sub" x="160" y="1453">Flash "Specimen still processing"</text>
<line class="arrow-line" x1="160" y1="1467" x2="160" y2="1500" marker-end="url(#arr)" />
<rect class="terminal-box" x="60" y="1500" width="200" height="38" />
<text class="terminal-text" x="160" y="1520" dy="3.5">Wait: Check back later</text>

<!-- Decision 3 - YES / 200 Completed (Right) -->
<line class="arrow-line" x1="495" y1="1320" x2="570" y2="1320" />
<line class="arrow-line" x1="570" y1="1320" x2="570" y2="1415" marker-end="url(#arr)" />
<rect class="tag-black" x="555" y="1345" width="30" height="18" />
<text class="tag-text" x="570" y="1358">Yes</text>

<!-- 12. PARSE AND PERSIST IN HOSPITAL SQLITE -->
<rect class="process-box" x="420" y="1415" width="300" height="52" />
<text class="process-header" x="570" y="1435">services/result_sync_service.py</text>
<text class="process-sub" x="570" y="1453">Parse JSON, INSERT into test_results</text>
<text class="status-badge" x="590" y="1490" fill="#27AE60">Status: Completed / Abnormal</text>

<!-- Merge to Final Display -->
<line class="arrow-line" x1="570" y1="1467" x2="570" y2="1540" />
<line class="arrow-line" x1="570" y1="1540" x2="375" y2="1540" />
<line class="arrow-line" x1="375" y1="1540" x2="375" y2="1570" marker-end="url(#arr)" />

<!-- 13. RENDER DETAILED REPORT -->
<rect class="process-box" x="165" y="1570" width="420" height="52" />
<text class="process-header" x="375" y="1590">templates/result_details.html</text>
<text class="process-sub" x="375" y="1608">Doctor views clinical report (measurements, bounds, remarks)</text>

<!-- Line 13 -> Finish -->
<line class="arrow-line" x1="375" y1="1622" x2="375" y2="1660" marker-end="url(#arr)" />

<!-- 14. FINISH TERMINAL -->
<rect class="terminal-box" x="225" y="1660" width="300" height="38" />
<text class="terminal-text" x="375" y="1680" dy="3.5">Finish: Patient diagnostic report delivered</text>

</svg>