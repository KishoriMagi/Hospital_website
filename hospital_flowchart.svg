<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1680" width="750" height="1680" style="background:#F6F8FA;">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .terminal-box { fill: #2C3E50; rx: 20; ry: 20; }
  .terminal-text { fill: #FFFFFF; font-size: 13px; font-weight: 600; text-anchor: middle; }
  
  .process-box { fill: #EBF3FB; stroke: #2A75D3; stroke-width: 1.8; rx: 4; ry: 4; }
  .process-header { fill: #0D47A1; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .process-sub { fill: #1E3A5F; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
  
  .decision-diamond { fill: #FFF9E6; stroke: #E67E22; stroke-width: 2; }
  .decision-text { fill: #A04000; font-size: 12px; font-weight: 600; text-anchor: middle; }
  
  .error-box { fill: #FDEDEC; stroke: #E74C3C; stroke-width: 1.8; rx: 4; ry: 4; }
  .error-header { fill: #922B21; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .error-sub { fill: #78281F; font-size: 11px; font-weight: 500; text-anchor: middle; }
  
  .success-box { fill: #EAFAF1; stroke: #27AE60; stroke-width: 1.8; rx: 4; ry: 4; }
  .success-header { fill: #196F3D; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .success-sub { fill: #145A32; font-size: 11px; font-weight: 500; text-anchor: middle; }
  
  .arrow-line { stroke: #5D6D7E; stroke-width: 1.8; fill: none; }
  .status-badge { font-size: 11.5px; font-weight: 700; }
  .tag-black { fill: #1C2833; rx: 3; ry: 3; }
  .tag-text { fill: #FFFFFF; font-size: 10px; font-weight: 700; text-anchor: middle; }
</style>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#5D6D7E" />
  </marker>
</defs>

<!-- STEP 1: START TERMINAL -->
<rect class="terminal-box" x="225" y="25" width="300" height="42" />
<text class="terminal-text" x="375" y="47" dy="4">Start: Hospital Staff initiates test order</text>

<!-- Connect 1 -> 2 -->
<line class="arrow-line" x1="375" y1="67" x2="375" y2="100" marker-end="url(#arrow)" />

<!-- STEP 2: PATIENT ONBOARDING -->
<rect class="process-box" x="175" y="100" width="400" height="52" />
<text class="process-header" x="375" y="120">routes/patients.py</text>
<text class="process-sub" x="375" y="138">Hospital staff registers patient or selects existing Patient_ID</text>

<!-- Connect 2 -> 3 -->
<line class="arrow-line" x1="375" y1="152" x2="375" y2="185" marker-end="url(#arrow)" />

<!-- STEP 3: ORDER FORM -->
<rect class="process-box" x="175" y="185" width="400" height="52" />
<text class="process-header" x="375" y="205">routes/test_requests.py</text>
<text class="process-sub" x="375" y="223">Staff fills order form (Test_ID, Test_Type, Priority, Sample)</text>

<!-- Connect 3 -> 4 (Decision 1) -->
<line class="arrow-line" x1="375" y1="237" x2="375" y2="280" marker-end="url(#arrow)" />

<!-- STEP 4: DECISION 1 -->
<polygon class="decision-diamond" points="375,280 495,350 375,420 255,350" />
<text class="decision-text" x="375" y="340">Is Patient &amp; Test_ID valid?</text>
<text class="decision-text" x="375" y="358">(No duplicates &amp; fields filled?)</text>

<!-- Decision 1 - NO (Left Branch) -->
<line class="arrow-line" x1="255" y1="350" x2="160" y2="350" />
<line class="arrow-line" x1="160" y1="350" x2="160" y2="445" marker-end="url(#arrow)" />

<!-- Tag: No -->
<rect class="tag-black" x="145" y="375" width="30" height="18" />
<text class="tag-text" x="160" y="388">No</text>

<!-- Error Box 1 -->
<rect class="error-box" x="50" y="445" width="220" height="52" />
<text class="error-header" x="160" y="465">routes/test_requests.py</text>
<text class="error-sub" x="160" y="483">Flash validation error to UI</text>
<text class="status-badge" x="280" y="475" fill="#C0392B">Error</text>

<line class="arrow-line" x1="160" y1="497" x2="160" y2="530" marker-end="url(#arrow)" />
<rect class="terminal-box" x="60" y="530" width="200" height="38" />
<text class="terminal-text" x="160" y="550" dy="3.5">Stop: Re-enter valid details</text>

<!-- Decision 1 - YES (Right Branch) -->
<line class="arrow-line" x1="495" y1="350" x2="570" y2="350" />
<line class="arrow-line" x1="570" y1="350" x2="570" y2="445" marker-end="url(#arrow)" />

<!-- Tag: Yes -->
<rect class="tag-black" x="555" y="375" width="30" height="18" />
<text class="tag-text" x="570" y="388">Yes</text>

<!-- STEP 5: SAVE PENDING -->
<rect class="process-box" x="420" y="445" width="300" height="52" />
<text class="process-header" x="570" y="465">database/database.py</text>
<text class="process-sub" x="570" y="483">Save request to SQLite table</text>
<text class="status-badge" x="625" y="520" fill="#2980B9">Status: Pending</text>

<!-- Connect 5 -> 6 (Merging back to center line) -->
<line class="arrow-line" x1="570" y1="497" x2="570" y2="575" />
<line class="arrow-line" x1="570" y1="575" x2="375" y2="575" />
<line class="arrow-line" x1="375" y1="575" x2="375" y2="605" marker-end="url(#arrow)" />

<!-- STEP 6: BUILD CSV -->
<rect class="process-box" x="175" y="605" width="400" height="52" />
<text class="process-header" x="375" y="625">routes/test_requests.py</text>
<text class="process-sub" x="375" y="643">Builds standardized test_request_&lt;ID&gt;.csv using CSV writer</text>

<!-- Connect 6 -> 7 -->
<line class="arrow-line" x1="375" y1="657" x2="375" y2="690" marker-end="url(#arrow)" />

<!-- STEP 7: UPLOAD TO DROPBOX -->
<rect class="process-box" x="175" y="690" width="400" height="52" />
<text class="process-header" x="375" y="710">services/dropbox_service.py</text>
<text class="process-sub" x="375" y="728">Uploads request CSV to Dropbox /Requests/ folder</text>
<text class="status-badge" x="590" y="720" fill="#2980B9">Status: Sent to Lab</text>

<!-- Connect 7 -> 8 -->
<line class="arrow-line" x1="375" y1="742" x2="375" y2="785" marker-end="url(#arrow)" />

<!-- STEP 8: EXTERNAL LAB BLACK BOX -->
<rect x="150" y="785" width="450" height="60" rx="8" ry="8" fill="#F4ECF7" stroke="#8E44AD" stroke-width="2" stroke-dasharray="6 4" />
<text x="375" y="810" font-size="13" font-weight="700" fill="#6C3483" text-anchor="middle">[EXTERNAL: Diagnostic Laboratory Portal]</text>
<text x="375" y="828" font-size="11.5" font-weight="500" fill="#5B2C6F" text-anchor="middle">Downloads request, analyzes specimen &amp; uploads test_result_&lt;ID&gt;.csv to /Results/</text>

<!-- Connect 8 -> 9 -->
<line class="arrow-line" x1="375" y1="845" x2="375" y2="890" marker-end="url(#arrow)" />

<!-- STEP 9: SYNC ACTION -->
<rect class="process-box" x="175" y="890" width="400" height="52" />
<text class="process-header" x="375" y="910">routes/results.py</text>
<text class="process-sub" x="375" y="928">Hospital Staff / Doctor clicks "Sync Results" button in UI</text>

<!-- Connect 9 -> 10 -->
<line class="arrow-line" x1="375" y1="942" x2="375" y2="975" marker-end="url(#arrow)" />

<!-- STEP 10: DOWNLOAD RESULTS -->
<rect class="process-box" x="175" y="975" width="400" height="52" />
<text class="process-header" x="375" y="995">services/dropbox_service.py</text>
<text class="process-sub" x="375" y="1013">Scans &amp; downloads test_result_&lt;ID&gt;.csv from /Results/</text>

<!-- Connect 10 -> 11 -->
<line class="arrow-line" x1="375" y1="1027" x2="375" y2="1060" marker-end="url(#arrow)" />

<!-- STEP 11: PANDAS VALIDATION -->
<rect class="process-box" x="175" y="1060" width="400" height="52" />
<text class="process-header" x="375" y="1080">services/result_sync_service.py</text>
<text class="process-sub" x="375" y="1098">Parses result CSV with Pandas &amp; checks columns and ID matches</text>

<!-- Connect 11 -> 12 (Decision 2) -->
<line class="arrow-line" x1="375" y1="1112" x2="375" y2="1155" marker-end="url(#arrow)" />

<!-- STEP 12: DECISION 2 (Result Valid?) -->
<polygon class="decision-diamond" points="375,1155 495,1225 375,1295 255,1225" />
<text class="decision-text" x="375" y="1215">Are result values valid &amp;</text>
<text class="decision-text" x="375" y="1233">Result_Status == 'Normal'?</text>

<!-- Decision 2 - NO / ABNORMAL (Right Branch) -->
<line class="arrow-line" x1="495" y1="1225" x2="570" y2="1225" />
<line class="arrow-line" x1="570" y1="1225" x2="570" y2="1320" marker-end="url(#arrow)" />

<!-- Tag: Abnormal -->
<rect class="tag-black" x="550" y="1255" width="40" height="18" />
<text class="tag-text" x="570" y="1268">Abnormal</text>

<!-- Error / Abnormal Box -->
<rect class="error-box" x="460" y="1320" width="220" height="52" />
<text class="error-header" x="570" y="1340">Flag Result as: Abnormal</text>
<text class="error-sub" x="570" y="1358">Highlight out-of-range clinical alerts</text>
<text class="status-badge" x="600" y="1395" fill="#C0392B">Status: Abnormal</text>

<!-- Decision 2 - YES / NORMAL (Left Branch) -->
<line class="arrow-line" x1="255" y1="1225" x2="180" y2="1225" />
<line class="arrow-line" x1="180" y1="1225" x2="180" y2="1320" marker-end="url(#arrow)" />

<!-- Tag: Normal -->
<rect class="tag-black" x="160" y="1255" width="40" height="18" />
<text class="tag-text" x="180" y="1268">Normal</text>

<!-- Success / Normal Box -->
<rect class="success-box" x="70" y="1320" width="220" height="52" />
<text class="success-header" x="180" y="1340">Flag Result as: Normal</text>
<text class="success-sub" x="180" y="1358">Parameters within reference range</text>
<text class="status-badge" x="200" y="1395" fill="#27AE60">Status: Completed</text>

<!-- Merge Branches to Step 13 -->
<line class="arrow-line" x1="180" y1="1372" x2="180" y2="1435" />
<line class="arrow-line" x1="180" y1="1435" x2="375" y2="1435" />

<line class="arrow-line" x1="570" y1="1372" x2="570" y2="1435" />
<line class="arrow-line" x1="570" y1="1435" x2="375" y2="1435" />

<line class="arrow-line" x1="375" y1="1435" x2="375" y2="1465" marker-end="url(#arrow)" />

<!-- STEP 13: SAVE RESULT TO SQLITE -->
<rect class="process-box" x="175" y="1465" width="400" height="52" />
<text class="process-header" x="375" y="1485">database/database.py</text>
<text class="process-sub" x="375" y="1503">Save measurements into test_results &amp; update request status</text>

<!-- Connect 13 -> 14 -->
<line class="arrow-line" x1="375" y1="1517" x2="375" y2="1550" marker-end="url(#arrow)" />

<!-- STEP 14: DOCTOR VIEW -->
<rect class="process-box" x="175" y="1550" width="400" height="52" />
<text class="process-header" x="375" y="1570">templates/result_details.html</text>
<text class="process-sub" x="375" y="1588">Hospital Staff / Doctor views full lab report with parameter cards</text>

<!-- Connect 14 -> 15 (Finish) -->
<line class="arrow-line" x1="375" y1="1602" x2="375" y2="1635" marker-end="url(#arrow)" />

<!-- STEP 15: FINISH TERMINAL -->
<rect class="terminal-box" x="225" y="1635" width="300" height="38" />
<text class="terminal-text" x="375" y="1655" dy="3.5">Finish: Patient diagnostic lifecycle completed</text>

</svg>